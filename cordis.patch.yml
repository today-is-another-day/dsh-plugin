# dsh-deepseek-balance bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); activate with
# `dsh plugin --profile <name> add link:<path-to-this-package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (balance engine + /api/dsh-deepseek-balance route),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web
# GUI (badge left of the model selector).
- insert:
    - id: deepseek-balance
      name: 'dsh-deepseek-balance'
